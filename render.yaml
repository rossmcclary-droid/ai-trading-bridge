services:
  - type: web
    name: ai-trading-bridge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TRADING_BRIDGE_SECRET
        generateValue: true
      - key: TRADING_BRIDGE_DB
        value: /data/trading_bridge.db
      - key: TRADING_EXECUTION_ENABLED
        value: "false"
      - key: TRADING_LIVE_EXECUTION_ENABLED
        value: "false"
